name: StudentOS production HTTPS acceptance
on:
  push:
    branches: [qa/production]
  workflow_dispatch:
    inputs:
      free_plan_confirmed:
        description: 'Potwierdzam Workers Free bez płatnego planu i kredytów AI Gateway'
        required: true
        type: boolean
        default: false
      analyze_public_fixture:
        description: 'Zezwalam na jedną analizę publicznego fixture z limitu dziennego właściciela'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: studentos-production
  cancel-in-progress: false
jobs:
  production-https:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.free_plan_confirmed) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/qa/production')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_OWNER_ID: ${{ vars.GITHUB_OWNER_ID || github.actor_id }}
      FREE_PLAN_CONFIRMED: 'true'
      APP_URL: https://studentos.recytator.workers.dev
      STUDENTOS_PRODUCTION_AI: ${{ github.event_name == 'push' || inputs.analyze_public_fixture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test actual HTTPS Worker with a short-lived session for the existing owner
        run: node scripts/production-acceptance.mjs
      - name: Preserve sanitized production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studentos-production-https-acceptance
          path: artifacts/production-acceptance/
          retention-days: 14
